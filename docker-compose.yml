version: '3.8'

services:
  typst-api:
    build: .
    container_name: typst-http-api
    restart: unless-stopped
    pull_policy: build
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
