version: "3.9"

services:
  typst-api:
    build:
      context: https://github.com/chinpeerapat/typst-http-api-CJKy.git
      dockerfile_inline: |
        FROM python:3.11-slim

        ENV DEBIAN_FRONTEND=noninteractive
        WORKDIR /app

        # Instala dependências do sistema e cargo
        RUN apt-get update -y && \
            apt-get install -y --no-install-recommends \
              cargo \
              build-essential \
              pkg-config \
              libssl-dev \
              libfontconfig1-dev \
              libfreetype6-dev \
              libexpat1-dev \
              libharfbuzz-dev \
              ca-certificates && \
            rm -rf /var/lib/apt/lists/*

        # Instala dependências Python
        RUN pip install --upgrade pip

        COPY ./typst-http-api/requirements.txt requirements.txt
        RUN pip install -r requirements.txt

        COPY ./typst-http-api .
        RUN chmod +x gunicorn.sh

        EXPOSE 8000
        CMD ["sh", "gunicorn.sh"]

    container_name: typst-http-api
    restart: unless-stopped
    environment:
      - PORT=8000
    networks:
      - proxy_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy_network:
    external: true
